# Local development overrides. Loaded automatically by `docker compose up` / `docker compose watch`.
# Production-style run (no watch, runtime stage): docker compose -f compose.yaml up --build
#
# Dev workflow:
#   docker compose up --watch
# Edits under apps/<name>/src are synced into the container and `tsx watch` restarts the server.
# Changes to a package.json or the root pnpm-lock.yaml trigger a rebuild of that service.
#
# Paths: the build context is the repo root, so the container's workspace lives at /app/apps/<name>.
# The sync "target" must point there, and the rebuild paths are relative to the repo root.

services:
  web:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: apps/web/src
          target: /app/apps/web/src
        - action: rebuild
          path: apps/web/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  proxy:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: apps/proxy/src
          target: /app/apps/proxy/src
        - action: rebuild
          path: apps/proxy/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  app1:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: apps/app1/src
          target: /app/apps/app1/src
        - action: rebuild
          path: apps/app1/package.json
        - action: rebuild
          path: pnpm-lock.yaml

  app2:
    build:
      target: dev
    develop:
      watch:
        - action: sync
          path: apps/app2/src
          target: /app/apps/app2/src
