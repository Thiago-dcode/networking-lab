name: Build and publish image to GHCR

on: workflow_dispatch

permissions:
  contents: read
  packages: write          # lets GITHUB_TOKEN push to ghcr.io

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        run: |
          # ghcr.io/<owner>/<repo>-app1, all lowercase (Docker requires it)
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-app1" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/1/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
