name: Build and publish images to GHCR

on: workflow_dispatch

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push to ghcr.io

jobs:
  push-to-ghcr:
    runs-on: ubuntu-latest
    env:
      APPS: "web proxy app1 app2 app3"
      TAGS: "main ${{ github.sha }}"
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push all apps
        run: |
          read -ra APP_LIST <<< "$APPS"
          read -ra TAG_LIST <<< "$TAGS"

          for app in "${APP_LIST[@]}"; do
            image="ghcr.io/${GITHUB_REPOSITORY,,}-${app}"
            echo "building $app as $image"

            # build one -t flag per tag
            tag_args=()
            for tag in "${TAG_LIST[@]}"; do
              tag_args+=(-t "$image:$tag")
            done

            docker build "${tag_args[@]}" \
              -f "apps/$app/Dockerfile" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              .

            for tag in "${TAG_LIST[@]}"; do
              echo "pushing $image:$tag"
              docker push "$image:$tag"
            done
          done
